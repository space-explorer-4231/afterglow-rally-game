name: Web source checks
on:
  push:
    branches: [dev]
    paths: ['source/**', 'scripts/restore-source-assets.mjs', '.github/workflows/web-checks.yml']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: node scripts/restore-source-assets.mjs
      - run: npm ci
        working-directory: source
      - run: npm ci
        working-directory: source/server
      - run: npm run check:web
        working-directory: source
      - run: npm run build
        working-directory: source
      - run: npm run build
        working-directory: source/server
