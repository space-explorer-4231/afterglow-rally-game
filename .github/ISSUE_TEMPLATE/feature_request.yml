name: Suggest an improvement
description: Propose a focused improvement to the driving experience.
title: "[Idea]: "
body:
  - type: textarea
    id: need
    attributes:
      label: What player problem should this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your suggestion
      description: Describe the interaction, benefit and alternatives you considered.
    validations:
      required: true
